<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<meta name="description" content="Personal portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#22d3ee;--accent2:#a78bfa;--bg:#0b1120;--bg2:#111a2e;--card:#15203a;--text:#e6edf7;--muted:#94a3b8;--border:rgba(148,163,184,.15);--shadow:0 10px 30px rgba(0,0,0,.35);--radius:16px}
[data-theme="light"]{--bg:#f6f8fc;--bg2:#eef2f9;--card:#fff;--text:#0f172a;--muted:#475569;--border:rgba(15,23,42,.1);--shadow:0 10px 30px rgba(15,23,42,.08)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;overflow-x:hidden;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.container{width:min(1140px,92%);margin:auto}
.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;border-radius:50px;font-weight:600;font-size:.95rem;cursor:pointer;border:2px solid transparent;transition:.3s;font-family:inherit}
.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b1120}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 25px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn-outline{border-color:var(--accent);color:var(--accent);background:transparent}
.btn-outline:hover{background:var(--accent);color:#0b1120}
.btn-sm{padding:8px 16px;font-size:.82rem}
section{padding:96px 0}
section:nth-of-type(even){background:var(--bg2)}
.sec-head{text-align:center;margin-bottom:56px}
.sec-head h2{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700}
.sec-head p{color:var(--muted);margin-top:8px}
.sec-head .bar{width:70px;height:4px;border-radius:4px;margin:14px auto 0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* NAV */
header{position:fixed;inset:0 0 auto 0;z-index:100;transition:.3s}
header.scrolled{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);box-shadow:0 2px 20px rgba(0,0,0,.2)}
nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font-size:1.6rem;font-weight:800}
.nav-links{display:flex;gap:28px;list-style:none;align-items:center}
.nav-links a{font-weight:500;font-size:.95rem;color:var(--muted);transition:.2s;position:relative}
.nav-links a:hover,.nav-links a.active{color:var(--accent)}
.nav-links a.active::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--accent);border-radius:2px}
.nav-right{display:flex;gap:10px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:1.1rem}
.burger{display:none}
@media(max-width:900px){
  .burger{display:grid}
  .nav-links{position:fixed;top:72px;right:0;left:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--border);max-height:0;overflow:hidden;transition:max-height .35s}
  .nav-links.open{max-height:520px}
  .nav-links li{width:100%;text-align:center}
  .nav-links a{display:block;padding:14px}
  .nav-links a.active::after{display:none}
}
/* HERO */
#home{min-height:100vh;display:flex;align-items:center;padding-top:110px;position:relative;overflow:hidden;background:var(--bg)!important}
#home::before,#home::after{content:"";position:absolute;width:480px;height:480px;border-radius:50%;filter:blur(120px);opacity:.25;z-index:0}
#home::before{background:var(--accent);top:-120px;left:-120px}
#home::after{background:var(--accent2);bottom:-160px;right:-120px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center;position:relative;z-index:1}
.hero .hello{color:var(--accent);font-weight:600;font-size:1.1rem}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.6rem);line-height:1.15;font-weight:800;margin:6px 0 10px}
.hero h3{font-size:clamp(1.1rem,2.5vw,1.5rem);font-weight:500;color:var(--muted);min-height:2.2em}
.hero h3 .typed{color:var(--text);font-weight:600;border-right:3px solid var(--accent);padding-right:4px}
.hero p.tag{color:var(--muted);margin:14px 0 26px;max-width:560px}
.hero-btns{display:flex;flex-wrap:wrap;gap:14px}
.socials{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.socials a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--border);background:var(--card);transition:.3s}
.socials a:hover{background:var(--accent);color:#0b1120;transform:translateY(-4px)}
.socials svg{width:20px;height:20px}
.hero-img{justify-self:center;position:relative}
.avatar{width:clamp(240px,32vw,380px);aspect-ratio:1;border-radius:50%;padding:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));animation:float 5s ease-in-out infinite}
.avatar>div,.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--card);display:grid;place-items:center;font-size:clamp(4rem,9vw,7rem);font-weight:800}
@keyframes float{50%{transform:translateY(-14px)}}
.stats{display:flex;gap:16px;margin-top:34px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;flex:1 1 120px;max-width:180px}
.stat b{font-size:1.5rem;display:block;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
@media(max-width:900px){.hero{grid-template-columns:1fr;text-align:center}.hero-img{order:-1}.hero p.tag{margin-inline:auto}.hero-btns,.socials,.stats{justify-content:center}}
/* ABOUT */
.about{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.about p{color:var(--muted);margin-bottom:16px}
.info-list{display:grid;gap:10px;margin:20px 0}
.info-list div{display:flex;gap:10px;align-items:center}
.info-list svg{width:18px;height:18px;color:var(--accent);flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:50px;font-size:.82rem;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.skill{margin-bottom:18px}
.skill .top{display:flex;justify-content:space-between;font-weight:500;font-size:.95rem;margin-bottom:6px}
.skill .track{height:9px;border-radius:9px;background:var(--border);overflow:hidden}
.skill .fill{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1.4s ease}
@media(max-width:900px){.about{grid-template-columns:1fr}}
/* TIMELINE */
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:40px}
.col-title{font-size:1.3rem;font-weight:600;margin-bottom:24px;display:flex;align-items:center;gap:10px}
.timeline{border-left:2px solid var(--border);padding-left:28px}
.t-item{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:22px;box-shadow:var(--shadow)}
.t-item::before{content:"";position:absolute;left:-37px;top:26px;width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}
.t-item .period{display:inline-block;font-size:.8rem;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 12px;border-radius:50px;margin-bottom:8px}
.t-item h4{font-size:1.1rem}
.t-item .sub{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.t-item ul{padding-left:18px;color:var(--muted);font-size:.92rem}
.t-item li{margin-bottom:5px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);transition:.35s}
.card:hover{transform:translateY(-8px);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.card .ic{font-size:2.2rem;width:64px;height:64px;display:grid;place-items:center;border-radius:16px;background:color-mix(in srgb,var(--accent) 12%,transparent);margin-bottom:16px}
.card h4{font-size:1.15rem;margin-bottom:8px}
.card p{color:var(--muted);font-size:.93rem}
/* PROJECTS */
.filters{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:36px}
.filters button{padding:8px 20px;border-radius:50px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-family:inherit;font-weight:500;transition:.25s}
.filters button.active,.filters button:hover{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b1120;border-color:transparent}
.proj{padding:0;overflow:hidden;display:flex;flex-direction:column}
.proj .thumb{aspect-ratio:16/9;padding:0;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,var(--card)),color-mix(in srgb,var(--accent2) 35%,var(--card)));display:grid;place-items:center;font-size:1.4rem;font-weight:700;color:#fff;text-align:center;padding:20px;overflow:hidden}
.proj .thumb img{width:100%;height:100%;object-fit:cover;object-position:top;transition:.5s}
.proj .thumb .ph{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:1.05rem;padding:16px}.proj .thumb .ph span{font-size:2.8rem}
.proj:hover .thumb img{transform:scale(1.06)}
.proj .body{padding:22px;display:flex;flex-direction:column;flex:1}
.proj .cat{font-size:.75rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.proj .tools{font-size:.82rem;color:var(--muted);margin:6px 0 10px}
.proj .tools b{color:var(--text)}
.proj .links{display:flex;gap:10px;margin-top:auto;padding-top:16px;flex-wrap:wrap}
/* SKILLS */
.skill-group h4{font-size:1rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.skill-group h4::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
/* ACHIEVE */
.list-card{display:flex;align-items:center;gap:16px;padding:20px}
.list-card .ic{margin:0;width:52px;height:52px;font-size:1.5rem;flex-shrink:0}
.list-card h4{font-size:1rem;margin:0}
.list-card a{font-size:.85rem;color:var(--accent);font-weight:500}
/* FAQ */
.faq{max-width:820px;margin:auto}
.faq-item{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}
.faq-q{width:100%;text-align:left;padding:18px 22px;background:none;border:0;color:var(--text);font:600 1rem 'Poppins',sans-serif;cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.faq-q span:last-child{color:var(--accent);transition:.3s;font-size:1.3rem;line-height:1}
.faq-item.open .faq-q span:last-child{transform:rotate(45deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s;color:var(--muted);padding:0 22px}
.faq-item.open .faq-a{max-height:400px;padding-bottom:18px}
/* CONTACT */
.contact{display:grid;grid-template-columns:1fr 1.3fr;gap:40px}
.c-info{display:grid;gap:16px;align-content:start}
.c-info .card{display:flex;gap:16px;align-items:center;padding:20px}
.c-info .ic{margin:0;width:50px;height:50px;font-size:1.2rem;flex-shrink:0}
.c-info .ic svg{width:22px;height:22px;color:var(--accent)}
.c-info small{color:var(--muted);display:block}
.c-info b{word-break:break-word;font-weight:500}
form .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
form input,form textarea{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit;margin-bottom:16px;outline:none;transition:.2s}
form input:focus,form textarea:focus{border-color:var(--accent)}
form textarea{min-height:150px;resize:vertical}
.form-msg{margin-top:12px;font-size:.9rem;color:var(--accent)}
@media(max-width:900px){.contact{grid-template-columns:1fr}}
@media(max-width:520px){form .row{grid-template-columns:1fr;gap:0}section{padding:72px 0}.grid{grid-template-columns:1fr}}
/* FOOTER */
footer{padding:36px 0;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:.9rem}
footer .socials{justify-content:center;margin:0 0 14px}
#toTop{position:fixed;right:22px;bottom:22px;width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1120;font-size:1.3rem;cursor:pointer;opacity:0;pointer-events:none;transition:.3s;z-index:90}
#toTop.show{opacity:1;pointer-events:auto}
.reveal{opacity:0;transform:translateY(40px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
.preview-badge{position:fixed;left:16px;bottom:16px;z-index:200;background:#f59e0b;color:#000;padding:8px 14px;border-radius:50px;font-size:.8rem;font-weight:600}
</style>
</head>
<body>
<header id="header"><div class="container"><nav>
  <a href="#home" class="logo grad" id="logo"></a>
  <ul class="nav-links" id="navLinks"></ul>
  <div class="nav-right">
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☾</button>
    <button class="icon-btn burger" id="burger" aria-label="Menu">☰</button>
  </div>
</nav></div></header>

<main id="app"></main>

<!-- Hidden static form so Netlify Forms can detect it at deploy time -->
<form name="contact" netlify netlify-honeypot="bot-field" hidden><input name="name"><input name="email"><input name="subject"><textarea name="message"></textarea></form>

<footer><div class="container"><div class="socials" id="footSocials"></div><p id="footText"></p></div></footer>
<button id="toTop" aria-label="Back to top">↑</button>

<script src="data.js"></script>
<script>
(function(){
let D = window.SITE_DATA;
const isPreview = new URLSearchParams(location.search).has('preview');
if (isPreview) { try { const d = localStorage.getItem('siteDataDraft'); if (d) D = JSON.parse(d); } catch(e){} }
if (!D) { document.getElementById('app').innerHTML = '<p style="padding:120px 20px;text-align:center">data.js not found.</p>'; return; }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr = a => Array.isArray(a) ? a : [];
const S = D.settings || {}, P = D.profile || {}, show = k => !S.showSections || S.showSections[k] !== false;

const ICONS = {
  linkedin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>',
  github:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.2.8.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1.1.9 2.2v3.3c0 .3.1.7.8.6A12 12 0 0 0 12 .3"/></svg>',
  email:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  location:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  facebook:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4h-3V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12"/></svg>',
  twitter:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.2 2.3h3.4l-7.4 8.4 8.7 11.5h-6.8l-5.3-7-6.1 7H1.3l7.9-9L.8 2.3h7l4.8 6.4 5.6-6.4zm-1.2 17.9h1.9L7.1 4.2H5.1L17 20.2z"/></svg>',
  youtube:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg>',
  medium:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 12a6.8 6.8 0 1 1-13.5 0 6.8 6.8 0 0 1 13.5 0zm7.4 0c0 3.5-1.5 6.4-3.4 6.4s-3.4-2.9-3.4-6.4 1.5-6.4 3.4-6.4 3.4 2.9 3.4 6.4M24 12c0 3.2-.5 5.7-1.2 5.7s-1.2-2.6-1.2-5.7.5-5.7 1.2-5.7S24 8.8 24 12"/></svg>',
  huggingface:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="10" r="1.4"/><circle cx="15.5" cy="10" r="1.4"/><path d="M7.5 14c1 2 2.7 3 4.5 3s3.5-1 4.5-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  website:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>'
};
const icon = n => ICONS[(n||'').toLowerCase()] || ICONS.website;
const socialsHTML = () => arr(P.socials).filter(s=>s.url).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.name)}" aria-label="${esc(s.name)}">${icon(s.icon||s.name)}</a>`).join('');
const head = (t, sub) => `<div class="sec-head reveal"><h2>${t}</h2>${sub?`<p>${esc(sub)}</p>`:''}<div class="bar"></div></div>`;
const initials = (P.name||'?').split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();

// theme & meta
const root = document.documentElement;
if (S.accentColor) root.style.setProperty('--accent', S.accentColor);
if (S.accentColor2) root.style.setProperty('--accent2', S.accentColor2);
let theme; try { theme = localStorage.getItem('theme'); } catch(e){}
root.dataset.theme = theme || S.defaultTheme || 'dark';
document.title = S.siteTitle || P.name || 'Portfolio';
document.getElementById('logo').textContent = S.logoText || P.name || '';

// nav
const navItems = [['home','Home',true],['about','About',show('about')],['experience','Resume',show('experience')],['services','What I Do',show('services')],['projects','Projects',show('projects')],['skills','Skills',show('skills')],['achievements','Achievements',show('achievements')],['contact','Contact',show('contact')]];
document.getElementById('navLinks').innerHTML = navItems.filter(n=>n[2]).map(n=>`<li><a href="#${n[0]}">${n[1]}</a></li>`).join('');

let h = '';
// HERO
h += `<section id="home"><div class="container hero">
  <div class="reveal">
    <div class="hello">${esc(P.greeting)}</div>
    <h1 class="grad">${esc(P.name)}</h1>
    <h3><span class="typed" id="typed">${esc(P.title)}</span></h3>
    <p class="tag">${esc(P.tagline)}</p>
    <div class="hero-btns">
      ${show('contact')?`<a href="#contact" class="btn btn-primary">Hire Me</a>`:''}
      ${P.resumeUrl?`<a href="${esc(P.resumeUrl)}" target="_blank" rel="noopener" class="btn btn-outline">Download CV</a>`:(show('projects')?`<a href="#projects" class="btn btn-outline">View Projects</a>`:'')}
    </div>
    <div class="socials">${socialsHTML()}</div>
    ${arr(P.stats).length?`<div class="stats">${arr(P.stats).map(s=>`<div class="stat"><b class="grad">${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div>`:''}
  </div>
  <div class="hero-img reveal"><div class="avatar">${P.photo?`<img src="${esc(P.photo)}" alt="${esc(P.name)}">`:`<div><span class="grad">${esc(initials)}</span></div>`}</div></div>
</div></section>`;

// ABOUT
if (show('about')) { const A = D.about||{};
h += `<section id="about"><div class="container">${head(esc(A.heading||'About Me'))}
<div class="about">
  <div class="reveal">
    ${arr(A.paragraphs).map(p=>`<p>${esc(p)}</p>`).join('')}
    <div class="info-list">
      ${P.location?`<div>${ICONS.location}<span>${esc(P.location)}</span></div>`:''}
      ${P.email?`<div>${ICONS.email}<a href="mailto:${esc(P.email)}">${esc(P.email)}</a></div>`:''}
      ${P.phone?`<div>${ICONS.phone}<a href="tel:${esc(P.phone.replace(/\s/g,''))}">${esc(P.phone)}</a></div>`:''}
    </div>
    ${arr(A.interests).length?`<h4 style="margin:22px 0 12px">Areas of Interest</h4><div class="chips">${arr(A.interests).map(i=>`<span class="chip">${esc(i)}</span>`).join('')}</div>`:''}
  </div>
  <div class="reveal"><h3 class="col-title">Core Skills</h3>
    ${arr(A.coreSkills).map(s=>`<div class="skill"><div class="top"><span>${esc(s.name)}</span><span>${+s.percent||0}%</span></div><div class="track"><div class="fill" data-w="${Math.min(100,+s.percent||0)}"></div></div></div>`).join('')}
  </div>
</div></div></section>`; }

// EXPERIENCE + EDUCATION
if (show('experience')) {
h += `<section id="experience"><div class="container">${head('Resume','My professional journey & education')}
<div class="two-col">
  <div><h3 class="col-title reveal">💼 Experience</h3><div class="timeline">
    ${arr(D.experience).map(e=>`<div class="t-item reveal"><span class="period">${esc(e.period)}</span><h4>${esc(e.role)}</h4><div class="sub">${esc(e.company)}${e.location?' · '+esc(e.location):''}</div><ul>${arr(e.points).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`).join('')}
  </div></div>
  <div><h3 class="col-title reveal">🎓 Education</h3><div class="timeline">
    ${arr(D.education).map(e=>`<div class="t-item reveal"><span class="period">${esc(e.period)}</span><h4>${esc(e.degree)}</h4><div class="sub">${esc(e.institute)}</div>${e.result?`<div style="font-weight:600">${esc(e.result)}</div>`:''}</div>`).join('')}
  </div></div>
</div></div></section>`; }

// SERVICES
if (show('services') && arr(D.services).length) {
h += `<section id="services"><div class="container">${head('What I Do','Services & solutions I deliver')}
<div class="grid">${arr(D.services).map(s=>`<div class="card reveal"><div class="ic">${esc(s.icon)}</div><h4>${esc(s.title)}</h4><p>${esc(s.description)}</p></div>`).join('')}</div></div></section>`; }

// PROJECTS
if (show('projects')) { const PR = D.projects||{}; const cats = arr(PR.categories).length ? PR.categories : ['All'];
h += `<section id="projects"><div class="container">${head('Projects','Things I have built and deployed')}
<div class="filters reveal">${cats.map((c,i)=>`<button class="${i?'':'active'}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
<div class="grid" id="projGrid">${arr(PR.items).map(p=>`<div class="card proj reveal" data-cat="${esc(p.category)}">
  <div class="thumb">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">`:`<div class="ph"><span>${({'Automation':'⚙️','AI / ML':'🧠','Data & BI':'📊','Web & Network':'🌐'})[p.category]||'💡'}</span>${esc(p.title)}</div>`}</div>
  <div class="body"><span class="cat">${esc(p.category)}</span><h4>${esc(p.title)}</h4>
  ${p.tools?`<div class="tools"><b>Tools:</b> ${esc(p.tools)}</div>`:''}<p>${esc(p.description)}</p>
  <div class="links">${p.github?`<a class="btn btn-outline btn-sm" href="${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>`:''}${p.live?`<a class="btn btn-primary btn-sm" href="${esc(p.live)}" target="_blank" rel="noopener">Live Demo</a>`:''}</div></div>
</div>`).join('')}</div>
<div style="text-align:center;margin-top:36px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap"><button class="btn btn-outline" id="moreProj" hidden>Show More Projects</button>${PR.moreUrl?`<a class="btn btn-primary" href="${esc(PR.moreUrl)}" target="_blank" rel="noopener">View All on GitHub</a>`:''}</div>
</div></section>`; }

// SKILLS
if (show('skills') && arr(D.skills).length) {
h += `<section id="skills"><div class="container">${head('Skills At a Glance')}
<div class="grid">${arr(D.skills).map(g=>`<div class="card skill-group reveal"><h4>${esc(g.group)}</h4><div class="chips">${arr(g.items).map(i=>`<span class="chip">${esc(i)}</span>`).join('')}</div></div>`).join('')}</div></div></section>`; }

// ACHIEVEMENTS + ACTIVITIES
if ((show('achievements') && arr(D.achievements).length) || (show('activities') && arr(D.activities).length)) {
h += `<section id="achievements"><div class="container">${head('Achievements & Activities')}<div class="two-col">`;
if (show('achievements')) h += `<div><h3 class="col-title reveal">🏆 Achievements</h3><div style="display:grid;gap:16px">${arr(D.achievements).map(a=>`<div class="card list-card reveal"><div class="ic">🏅</div><div><h4>${esc(a.title)}</h4>${a.link?`<a href="${esc(a.link)}" target="_blank" rel="noopener">View Certificate →</a>`:''}</div></div>`).join('')}</div></div>`;
if (show('activities')) h += `<div><h3 class="col-title reveal">🤝 Extracurricular</h3><div style="display:grid;gap:16px">${arr(D.activities).map(a=>`<div class="card list-card reveal"><div class="ic">⭐</div><h4>${esc(a)}</h4></div>`).join('')}</div></div>`;
h += `</div></div></section>`; }

// FAQ
if (show('faq') && arr(D.faq).length) {
h += `<section id="faq"><div class="container">${head('Frequently Asked Questions')}
<div class="faq">${arr(D.faq).map((f,i)=>`<div class="faq-item reveal"><button class="faq-q"><span>${i+1}. ${esc(f.q)}</span><span>+</span></button><div class="faq-a">${esc(f.a)}</div></div>`).join('')}</div></div></section>`; }

// CONTACT
if (show('contact')) { const C = D.contact||{};
h += `<section id="contact"><div class="container">${head(esc(C.heading||'Contact'), C.text)}
<div class="contact">
  <div class="c-info">
    ${P.location?`<div class="card reveal"><div class="ic">${ICONS.location}</div><div><small>Address</small><b>${esc(P.location)}</b></div></div>`:''}
    ${P.phone?`<div class="card reveal"><div class="ic">${ICONS.phone}</div><div><small>Phone</small><b><a href="tel:${esc(P.phone.replace(/\s/g,''))}">${esc(P.phone)}</a></b></div></div>`:''}
    ${P.email?`<div class="card reveal"><div class="ic">${ICONS.email}</div><div><small>Email</small><b><a href="mailto:${esc(P.email)}">${esc(P.email)}</a></b></div></div>`:''}
  </div>
  <form class="card reveal" id="cform" name="contact">
    <input type="hidden" name="form-name" value="contact"><p hidden><input name="bot-field"></p>
    <div class="row"><input name="name" placeholder="Your Name" required><input name="email" type="email" placeholder="Your Email" required></div>
    <input name="subject" placeholder="Subject">
    <textarea name="message" placeholder="Your Message" required></textarea>
    <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn btn-primary" type="submit">Send Message</button><button class="btn btn-outline" type="reset">Clear</button></div>
    <div class="form-msg" id="formMsg"></div>
  </form>
</div></div></section>`; }

document.getElementById('app').innerHTML = h;
document.getElementById('footSocials').innerHTML = socialsHTML();
document.getElementById('footText').textContent = (D.footer||{}).text || '';
if (isPreview) document.body.insertAdjacentHTML('beforeend','<div class="preview-badge">PREVIEW (unsaved draft)</div>');

// ---------- interactions ----------
const header = document.getElementById('header'), toTop = document.getElementById('toTop');
const links = [...document.querySelectorAll('.nav-links a')];
const onScroll = () => {
  header.classList.toggle('scrolled', scrollY > 30);
  toTop.classList.toggle('show', scrollY > 500);
  let cur = 'home';
  document.querySelectorAll('main section').forEach(s => { if (scrollY >= s.offsetTop - 120) cur = s.id; });
  links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#'+cur));
};
addEventListener('scroll', onScroll, {passive:true}); onScroll();
toTop.onclick = () => scrollTo({top:0});
const nav = document.getElementById('navLinks');
document.getElementById('burger').onclick = () => nav.classList.toggle('open');
links.forEach(a => a.onclick = () => nav.classList.remove('open'));

const themeBtn = document.getElementById('themeBtn');
const setIcon = () => themeBtn.textContent = root.dataset.theme === 'dark' ? '☀' : '☾';
setIcon();
themeBtn.onclick = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; try{localStorage.setItem('theme', root.dataset.theme)}catch(e){} setIcon(); };

// reveal + skill bars
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); e.target.querySelectorAll('.fill').forEach(f => f.style.width = f.dataset.w + '%'); io.unobserve(e.target); } }), {threshold:.12});
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

// typing effect
const words = arr(P.typingWords).length ? P.typingWords : [P.title||''];
const typed = document.getElementById('typed');
if (typed && words.length) { let w=0,c=0,del=false;
  (function tick(){ const word = words[w]; typed.textContent = word.slice(0,c);
    if(!del && c<word.length){c++;setTimeout(tick,90)} else if(!del){del=true;setTimeout(tick,1600)}
    else if(c>0){c--;setTimeout(tick,45)} else {del=false;w=(w+1)%words.length;setTimeout(tick,300)} })(); }

// project filter + show more
const limit = +((D.projects||{}).initialShow) || 0; let expanded = false, curCat = null;
const moreBtn = document.getElementById('moreProj');
function applyProj(){
  let n = 0, total = 0;
  document.querySelectorAll('#projGrid .proj').forEach(p => {
    const match = !curCat || p.dataset.cat === curCat; if (match) total++;
    const vis = match && (expanded || !limit || n < limit); if (vis) n++;
    p.style.display = vis ? '' : 'none'; if (vis) p.classList.add('in');
  });
  if (moreBtn) { moreBtn.hidden = !limit || total <= limit; moreBtn.textContent = expanded ? 'Show Less' : `Show More Projects (${total - limit})`; }
}
document.querySelectorAll('.filters button').forEach((b, i) => b.onclick = () => {
  document.querySelectorAll('.filters button').forEach(x => x.classList.remove('active')); b.classList.add('active');
  curCat = i === 0 ? null : b.dataset.cat; expanded = false; applyProj();
});
if (moreBtn) moreBtn.onclick = () => { expanded = !expanded; applyProj(); if (!expanded) document.getElementById('projects').scrollIntoView(); };
applyProj();

// faq
document.querySelectorAll('.faq-q').forEach(q => q.onclick = () => q.parentElement.classList.toggle('open'));

// contact form
const f = document.getElementById('cform');
if (f) f.onsubmit = async e => { e.preventDefault();
  const fd = new FormData(f), msg = document.getElementById('formMsg'), btn = f.querySelector('button[type=submit]');
  const C = D.contact || {}, mode = C.formMode || 'formsubmit', to = C.formEmail || P.email;
  const fail = () => { msg.style.color = '#f87171'; msg.innerHTML = `Message could not be sent. Please email me directly at <a href="mailto:${esc(to)}" style="text-decoration:underline">${esc(to)}</a>`; };
  msg.style.color = ''; msg.textContent = 'Sending…'; btn.disabled = true;
  try {
    if (mode === 'netlify') {
      const r = await fetch('/', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(fd).toString()});
      if (!r.ok) throw 0; msg.textContent = '✔ Thank you! Your message has been sent.'; f.reset();
    } else if (mode === 'mailto') {
      const body = `Name: ${fd.get('name')}\nEmail: ${fd.get('email')}\n\n${fd.get('message')}`;
      location.href = `mailto:${to}?subject=${encodeURIComponent(fd.get('subject')||'Portfolio Contact')}&body=${encodeURIComponent(body)}`;
      msg.innerHTML = `Opening your email app… If nothing opens, email me at <a href="mailto:${esc(to)}" style="text-decoration:underline">${esc(to)}</a>`;
    } else {
      const r = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(to), {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
        body: JSON.stringify({name:fd.get('name'), email:fd.get('email'), _subject:'Portfolio: ' + (fd.get('subject')||'New message'), message:fd.get('message'), _replyto:fd.get('email'), _template:'table', _captcha:'false'})});
      const j = await r.json().catch(() => ({}));
      if (!r.ok || String(j.success) !== 'true') { if (j.message) { msg.style.color = '#fbbf24'; msg.textContent = j.message; } else fail(); }
      else { msg.textContent = '✔ Thank you! Your message has been sent. I will get back to you soon.'; f.reset(); }
    }
  } catch (err) { fail(); }
  btn.disabled = false;
};
})();
</script>
</body>
</html>
