<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Website Editor</title>
<style>
:root{--a:#22d3ee;--a2:#a78bfa;--bg:#0b1120;--bg2:#111a2e;--card:#15203a;--t:#e6edf7;--m:#94a3b8;--b:rgba(148,163,184,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--t);font-size:14px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;background:var(--bg2);border-bottom:1px solid var(--b)}
.top h1{font-size:1.1rem;margin-right:auto;background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--b);background:var(--card);color:var(--t);padding:8px 14px;border-radius:8px;white-space:nowrap}
button:hover{border-color:var(--a)}
.pri{background:linear-gradient(90deg,var(--a),var(--a2));color:#0b1120;border:0;font-weight:600}
.status{font-size:12px;color:var(--m);width:100%}
.wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 90px)}
.side{border-right:1px solid var(--b);padding:14px;position:sticky;top:90px;align-self:start}
.side button{display:block;width:100%;text-align:left;margin-bottom:6px;text-transform:capitalize}
.side button.on{background:var(--a);color:#0b1120;border-color:var(--a);font-weight:600}
.main{padding:22px;max-width:900px;width:100%}
.main h2{text-transform:capitalize;margin-bottom:16px}
.field{margin-bottom:14px}
.field>label{display:block;font-weight:600;font-size:12px;color:var(--m);margin-bottom:5px;text-transform:capitalize}
input[type=text],input[type=number],textarea,select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--b);background:var(--bg);color:var(--t);font:inherit}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--a)}
fieldset{border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--bg2)}
legend{padding:0 8px;font-weight:600;color:var(--a);text-transform:capitalize}
.item{border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--card)}
.item-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.item-h b{margin-right:auto;font-size:12px;color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-h button{padding:4px 9px;font-size:12px}
.item.str{display:flex;gap:6px;align-items:flex-start;padding:8px}
.item.str textarea,.item.str input{flex:1}
.item.str button{padding:6px 9px}
.add{border-style:dashed;width:100%;color:var(--a)}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chk input{width:18px;height:18px;accent-color:var(--a)}
.img-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.img-row input[type=text]{flex:1;min-width:180px}
.img-prev{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--b)}
.hint{font-size:12px;color:var(--m);margin-top:4px}
.help{background:var(--card);border:1px solid var(--b);border-left:4px solid var(--a);border-radius:10px;padding:14px 16px;margin-bottom:20px;line-height:1.6;color:var(--m)}
.help b{color:var(--t)}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.side{position:static;display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--b);padding:10px}.side button{width:auto;margin:0}.main{padding:14px}}
</style>
</head>
<body>
<div class="top">
  <h1>✏️ Website Editor</h1>
  <button onclick="preview()">👁 Preview</button>
  <button onclick="document.getElementById('imp').click()">📂 Import</button>
  <button onclick="resetDraft()">↺ Reset</button>
  <button class="pri" onclick="download()">⬇ Download data.js</button>
  <input type="file" id="imp" accept=".js,.json" hidden onchange="importFile(this.files[0])">
  <div class="status" id="status"></div>
</div>
<div class="wrap">
  <div class="side" id="side"></div>
  <div class="main" id="main"></div>
</div>

<script src="data.js"></script>
<script>
const PUBLISHED = JSON.parse(JSON.stringify(window.SITE_DATA || {}));
let data, current;
try { data = JSON.parse(localStorage.getItem('siteDataDraft')); } catch(e){}
const hadDraft = !!data;
if (!data) data = JSON.parse(JSON.stringify(PUBLISHED));

// Templates for "Add" buttons: first element of every array found in the published data, by key name
const TPL = {};
(function scan(o){ if (Array.isArray(o)) { o.forEach(scan); return; } if (o && typeof o === 'object') for (const k in o) { const v = o[k]; if (Array.isArray(v) && v.length && !(k in TPL)) TPL[k] = blank(v[0]); scan(v); } })(PUBLISHED);
function blank(v){ if (Array.isArray(v)) return []; if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = blank(v[k]); return o; } if (typeof v === 'number') return 0; if (typeof v === 'boolean') return true; return ''; }

const pretty = k => String(k).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/_/g,' ');
const LONG = /description|tagline|text|paragraph|points|^a$|summary|bio|details/i;
const IMG = /photo|image|img|avatar|logo$|thumbnail/i;
const COLOR = /color/i;

function setStatus(t){ document.getElementById('status').textContent = t; }
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem('siteDataDraft', JSON.stringify(data)); setStatus('✔ Draft saved in this browser · ' + new Date().toLocaleTimeString() + ' — click "Download data.js" and upload it to your site to publish.'); } catch(e) { setStatus('⚠ Could not save draft (storage full? try smaller images).'); } }, 300); }

function sidebar(){
  const keys = Object.keys(data);
  if (!current || !(current in data)) current = keys[0];
  document.getElementById('side').innerHTML = keys.map(k => `<button class="${k===current?'on':''}" onclick="go('${k}')">${pretty(k)}</button>`).join('');
}
function go(k){ current = k; sidebar(); render(); scrollTo(0,0); }

function render(){
  const main = document.getElementById('main'); main.innerHTML = '';
  if (current === Object.keys(data)[0]) main.insertAdjacentHTML('beforeend', `<div class="help"><b>How it works:</b> Edit anything below — changes save automatically as a draft in this browser. Click <b>Preview</b> to see the site with your changes. When happy, click <b>Download data.js</b> and replace the old <b>data.js</b> in your website folder (then re-upload to Netlify). Use <b>↑ ↓ ✕</b> to reorder/delete and <b>+ Add</b> to add new items.</div>`);
  const h = document.createElement('h2'); h.textContent = pretty(current); main.appendChild(h);
  main.appendChild(build(data, current, current));
}

function build(parent, key, label){
  const val = parent[key];
  if (Array.isArray(val)) return buildArray(parent, key, label);
  if (val && typeof val === 'object') {
    const fs = document.createElement('div');
    for (const k in val) {
      const sub = val[k];
      if (sub && typeof sub === 'object') { const f = document.createElement('fieldset'); f.innerHTML = `<legend>${pretty(k)}</legend>`; f.appendChild(build(val, k, k)); fs.appendChild(f); }
      else fs.appendChild(build(val, k, k));
    }
    return fs;
  }
  return buildPrimitive(parent, key, label);
}

function buildPrimitive(parent, key, label, inList){
  const val = parent[key], wrap = document.createElement('div');
  if (!inList) { wrap.className = 'field'; }
  if (typeof val === 'boolean') {
    wrap.className = 'chk'; wrap.innerHTML = `<input type="checkbox" ${val?'checked':''}><label>${pretty(label)}</label>`;
    wrap.querySelector('input').onchange = e => { parent[key] = e.target.checked; save(); };
    return wrap;
  }
  if (!inList) wrap.innerHTML = `<label>${pretty(label)}</label>`;
  let el;
  if (typeof val === 'number') { el = document.createElement('input'); el.type = 'number'; el.value = val; el.oninput = () => { parent[key] = +el.value; save(); }; }
  else if (LONG.test(label) || String(val).length > 90) { el = document.createElement('textarea'); el.value = val ?? ''; el.oninput = () => { parent[key] = el.value; save(); }; }
  else { el = document.createElement('input'); el.type = 'text'; el.value = val ?? ''; el.oninput = () => { parent[key] = el.value; save(); }; }

  if (typeof label === 'string' && IMG.test(label)) {
    const row = document.createElement('div'); row.className = 'img-row';
    const isData = String(val).startsWith('data:');
    if (isData) { el.value = '(uploaded image)'; el.disabled = true; }
    const prev = document.createElement('img'); prev.className = 'img-prev'; if (val) prev.src = val; else prev.style.display = 'none';
    const up = document.createElement('button'); up.textContent = '📷 Upload';
    const clr = document.createElement('button'); clr.textContent = '✕';
    const file = document.createElement('input'); file.type = 'file'; file.accept = 'image/*'; file.hidden = true;
    up.onclick = () => file.click();
    clr.onclick = () => { parent[key] = ''; save(); render(); };
    file.onchange = () => resizeImage(file.files[0], url => { parent[key] = url; save(); render(); });
    el.oninput = () => { parent[key] = el.value; prev.src = el.value; prev.style.display = el.value ? '' : 'none'; save(); };
    row.append(prev, el, up, clr, file); wrap.appendChild(row);
    wrap.insertAdjacentHTML('beforeend', '<div class="hint">Paste an image URL / file path (e.g. assets/photo.jpg) or upload one (auto-resized).</div>');
    return wrap;
  }
  if (typeof label === 'string' && COLOR.test(label)) {
    const row = document.createElement('div'); row.className = 'img-row';
    const pick = document.createElement('input'); pick.type = 'color'; pick.value = /^#[0-9a-f]{6}$/i.test(val) ? val : '#22d3ee';
    pick.oninput = () => { el.value = pick.value; parent[key] = pick.value; save(); };
    el.oninput = () => { parent[key] = el.value; if (/^#[0-9a-f]{6}$/i.test(el.value)) pick.value = el.value; save(); };
    row.append(pick, el); wrap.appendChild(row); return wrap;
  }
  if (inList) return el;
  wrap.appendChild(el); return wrap;
}

function buildArray(parent, key, label){
  const list = parent[key], box = document.createElement('div');
  const isStr = list.length ? typeof list[0] !== 'object' : (TPL[key] === undefined || typeof TPL[key] !== 'object');
  list.forEach((item, i) => {
    const ctl = `<button title="Up">↑</button><button title="Down">↓</button><button title="Delete">✕</button>`;
    let it;
    if (item && typeof item === 'object') {
      it = document.createElement('div'); it.className = 'item';
      const title = item.title || item.name || item.role || item.degree || item.group || item.q || item.label || `#${i+1}`;
      it.innerHTML = `<div class="item-h"><b>${i+1}. ${String(title).replace(/</g,'&lt;')}</b>${ctl}</div>`;
      it.appendChild(build(list, i, i));
    } else {
      it = document.createElement('div'); it.className = 'item str';
      const el = buildPrimitive(list, i, key, true); it.appendChild(el);
      it.insertAdjacentHTML('beforeend', ctl);
    }
    const [up, down, del] = it.querySelectorAll(':scope > .item-h > button, :scope > button');
    up.onclick = () => { if (i>0) { [list[i-1], list[i]] = [list[i], list[i-1]]; save(); render(); } };
    down.onclick = () => { if (i<list.length-1) { [list[i+1], list[i]] = [list[i], list[i+1]]; save(); render(); } };
    del.onclick = () => { if (confirm('Delete this item?')) { list.splice(i,1); save(); render(); } };
    box.appendChild(it);
  });
  const add = document.createElement('button'); add.className = 'add'; add.textContent = '+ Add ' + pretty(key).replace(/s$/,'');
  add.onclick = () => { const t = list.length ? blank(list[0]) : (TPL[key] !== undefined ? JSON.parse(JSON.stringify(TPL[key])) : ''); list.push(t); save(); render(); };
  box.appendChild(add);
  return box;
}

function resizeImage(file, cb){
  if (!file) return; const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = img.width*s; c.height = img.height*s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .82)); };
    img.src = r.result; };
  r.readAsDataURL(file);
}

function fileText(){ return `// =====================================================================
//  SITE DATA — all website content lives here.
//  Easiest way to edit: open admin.html in your browser, change things,
//  then click "Download data.js" and replace this file.
// =====================================================================
window.SITE_DATA = ${JSON.stringify(data, null, 2)};
`; }
function download(){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([fileText()], {type:'text/javascript'}));
  a.download = 'data.js'; a.click(); setStatus('⬇ data.js downloaded — replace the old data.js in your website folder and re-deploy.');
}
function preview(){ localStorage.setItem('siteDataDraft', JSON.stringify(data)); open('index.html?preview=1', '_blank'); }
function resetDraft(){ if (confirm('Discard all unsaved draft changes and go back to the published data.js?')) { localStorage.removeItem('siteDataDraft'); data = JSON.parse(JSON.stringify(PUBLISHED)); sidebar(); render(); setStatus('Reset to published data.'); } }
function importFile(f){
  if (!f) return; f.text().then(t => {
    try { const m = t.indexOf('{'), n = t.lastIndexOf('}'); data = JSON.parse(t.slice(m, n+1)); save(); sidebar(); render(); setStatus('✔ Imported ' + f.name); }
    catch(e){ alert('Could not read that file. Use a data.js downloaded from this editor or a .json file.'); }
  });
}
sidebar(); render();
setStatus(hadDraft ? '📝 Loaded your saved draft from this browser (click Reset to discard it).' : 'Loaded published data.js');
</script>
</body>
</html>
